name: dsp core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test the DSP core and the plugin shell
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build the CLAP and VST3 shell
        run: cargo build -p cueharbor-plugin --manifest-path core/Cargo.toml
      - name: Build the WASM DSP
        run: cargo build -p cueharbor-dsp --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml
