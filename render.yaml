services:
  - type: web
    name: cueharbor
    runtime: node
    plan: free
    branch: main
    # Render sets NODE_ENV=production for the build, which makes plain `npm ci`
    # skip devDependencies. typescript and vite are required to compile the app.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
